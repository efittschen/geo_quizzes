<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review · Geo Quizzes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header wide">
    <div class="brand-row"><a class="brand" href="index.html">🌍 Geo Quizzes</a><h1 class="page-title">Review</h1></div>
    <div class="head-due" id="review-top" hidden>
      <span class="hd-n"><b id="rt-due"></b>due</span><span class="hd-n"><b id="rt-tomorrow"></b>tomorrow</span><span class="hd-n"><b id="rt-week"></b>this week</span>
      <div class="review-go" id="review-go"></div>
    </div>
    <nav><a href="index.html" aria-label="Back to map"><span class="back-long">← Back to map</span><span class="back-short" aria-hidden="true">←</span></a></nav>
  </header>

  <main class="review-page">
    <section>
      <div class="tabs" id="tabs" role="tablist" aria-label="Page">
        <button type="button" role="tab" data-tab="review" aria-selected="true">Stack</button>
        <button type="button" role="tab" data-tab="stats" aria-selected="false">Stats</button>
        <button type="button" role="tab" data-tab="map" aria-selected="false">Map</button>
      </div>
    </section>

    <div class="stats-page" id="stats" hidden></div>

    <section>
      <div class="list-bar" id="list-bar" hidden>
        <span class="count" id="stack-count"></span>
        <div class="view-pick" id="view-pick" role="group" aria-label="View">
          <button type="button" data-view="tree" aria-pressed="true">By quiz</button>
          <button type="button" data-view="due" aria-pressed="false">By due</button>
        </div>
      </div>
      <div class="tree" id="due-list" hidden>
        <table class="decks stack due-list">
          <colgroup><col class="c-due"><col><col><col class="c-grades"></colgroup>
          <thead><tr><th class="num">Due</th><th>Card</th><th>Quiz</th><th></th></tr></thead>
          <tbody id="due-rows"></tbody>
        </table>
      </div>
      <div class="tree" id="decks" hidden>
        <table class="decks stack">
          <colgroup><col><col class="c-due"><col class="c-learned"><col class="c-more"></colgroup>
          <thead><tr><th></th><th class="mid">Due</th><th class="mid">Learned</th><th></th></tr></thead>
          <tbody id="deck-rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>Nothing learned yet</p>
    </section>

    <section class="map-page" id="map-page" hidden><div class="by-map" id="map-view"></div></section>

  </main>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/answers.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/srs.js"></script>
  <script src="assets/js/card-view.js"></script>
  <script src="assets/js/review-map.js"></script>
  <script src="assets/js/review.js"></script>
  <script src="assets/js/stats.js"></script>
  <script src="assets/js/gamepad.js"></script>
</body>
</html>
