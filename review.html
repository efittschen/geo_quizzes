<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review · Geo Quizzes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">🌍 Geo Quizzes</a>
    <nav><a href="index.html">← Back to map</a></nav>
  </header>

  <main class="review-page">
    <section>
      <h1>Review</h1>
      <div class="review-go" id="review-go"></div>
      <div class="view-pick tabs" id="tabs" role="tablist" aria-label="Page">
        <button type="button" class="ghost small" role="tab" data-tab="review" aria-selected="true">Review</button>
        <button type="button" class="ghost small" role="tab" data-tab="stats" aria-selected="false">Stats</button>
      </div>
    </section>

    <div class="stats-page" id="stats" hidden></div>

    <section>
      <h2>Stack</h2>
      <div class="view-pick" id="view-pick" role="group" aria-label="View" hidden>
        <button type="button" class="ghost small" data-view="tree" aria-pressed="true">By quiz</button>
        <button type="button" class="ghost small" data-view="due" aria-pressed="false">By due</button>
      </div>
      <div class="tree" id="due-list" hidden>
        <table class="decks stack due-list">
          <colgroup><col class="c-due"><col><col><col class="c-grades"></colgroup>
          <thead><tr><th class="num">Due</th><th>Card</th><th>Quiz</th><th></th></tr></thead>
          <tbody id="due-rows"></tbody>
        </table>
      </div>
      <div class="tree" id="decks" hidden>
        <table class="decks stack">
          <colgroup><col><col class="c-due"><col class="c-learned"><col class="c-acts"></colgroup>
          <thead><tr><th>Quiz</th><th class="num">Due</th><th class="num learned">Learned</th><th></th></tr></thead>
          <tbody id="deck-rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>Nothing learned yet</p>
    </section>

  </main>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/answers.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/srs.js"></script>
  <script src="assets/js/review.js"></script>
  <script src="assets/js/stats.js"></script>
  <script src="assets/js/gamepad.js"></script>
</body>
</html>
