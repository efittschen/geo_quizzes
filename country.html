<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
  <link rel="stylesheet" href="assets/css/base.css">

    <a class="brand" href="index.html">🌍 Geo Quizzes</a>

  <main class="country-page">
    <section class="country-hero">

        <div class="review-go" id="review-go" hidden><span class="label">Review</span></div>

    </section>

    <ul id="quiz-cards" class="quiz-cards"></ul>
    <p id="empty" class="empty" hidden></p>
  </main>

  <script src="assets/js/d3.min.js"></script>
